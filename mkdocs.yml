site_name: Solidity GUI Documentation
repo_url: https://github.com/ImperialCollegeLondon/Solidity-GUI
watch: [solidity_gui]

theme:
  name: "material"

extra_css:
  - stylesheets/extra.css

markdown_extensions:
- admonition
- pymdownx.snippets:
    check_paths: true
- toc:
    permalink: "¤"

plugins:
- search
- gen-files:
    scripts:
    - docs/gen_ref_nav.py
- literate-nav:
    nav_file: SUMMARY.md
- section-index
- mkdocstrings:
    default_handler: python
    handlers:
      python:
        options:
          show_source: true
          show_root_heading: true
          show_category_heading: true
          merge_init_into_class: true
        paths: [solidity_gui]

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - User Guide: user_guide.md
  - Configuration: configuration.md
  - Developer Guide: developer.md
  - API Reference:
    - Overview: reference/index.md
  - Testing: testing.md
  - Build & Deployment: build_deployment.md
  - FAQ: faq.md
  - Contributing: contributing.md
