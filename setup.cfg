[aliases]
test = pytest

[tool:pytest]
addopts =
        -v -p no:warnings --flake8 --cov=solidity_gui --cov-report=html:htmlcov/coverage
        --timeout 30

[flake8]
max-line-length = 88
extend-ignore =
        E203,
required-plugins =
        flake8-docstring,
docstring-convention = google

[isort]
line_length = 88
multi_line_output = 3
include_trailing_comma = true
