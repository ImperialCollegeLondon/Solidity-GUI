[project]
name = "SolidityGUI"
version = "0.1"
authors = [
    { name = "Ryan Smith", email = "ryan.smith@imperial.ac.uk" },
    { name = "Chris Cave-Ayland", email = "c.cave-ayland@imperial.ac.uk" },
    { name = "Alex Dewar", email = "a.dewar@imperial.ac.uk" },
    { name = "Imperial College London RSE Team", email = "ict-rse-team@imperial.ac.uk" }
]
dependencies = ["jinja2", "marshmallow", "pygmsh", "pypubsub", "pyside6==6.3.2",
                "python-on-whales", "qtawesome", "vtk"]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["black", "flake8<5", "flake8-docstrings", "isort", "mkdocs", "mkdocstrings",
       "mkdocstrings-python", "mkdocs-material", "mkdocs-gen-files",
       "mkdocs-literate-nav", "mkdocs-section-index", "mypy", "pip-tools", "pre-commit",
       "pyflakes>=2.4.0, <4.0.0", "pyinstaller", "pytest", "pytest-cov", "pytest-flake8", "pytest-timeout",
       "pytest-qt", "scikit-learn"]

[tool.setuptools]
packages = ["solidity_gui"]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = ["tests/", ".venv/"]
