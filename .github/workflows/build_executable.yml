name: Build Executable

on:
    workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    env:
      DISPLAY: ":99.0"
      QT_DEBUG_PLUGINS: 1 # adds some verbosity but helpful to debug QT issues
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Dependencies (Linux)
        run: |
          sudo apt update
          sudo apt-get install -y libxcb-icccm4 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            x11-utils libegl1 libglu1-mesa libxcb-image0 \
            libxkbcommon-x11-0 libxcb-cursor0
        if: matrix.os == 'ubuntu-22.04'

      - name: Setup XServer and Window Manager (Linux)
        run: |
          /sbin/start-stop-daemon --start --quiet --pidfile /tmp/custom_xvfb_99.pid \
            --make-pidfile --background --exec /usr/bin/Xvfb -- :99 -screen 0 \
            1920x1200x24 -ac +extension GLX +render -noreset
        if: matrix.os == 'ubuntu-22.04'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
            python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r dev-requirements.txt

      - name: Use latest vtk release candidate for Linux
        if: matrix.os == 'ubuntu-22.04'
        run: pip install vtk==9.3.0rc1

      - name: Run tests (not windows)
        run: pytest
        if: matrix.os != 'windows-latest'

      - name: Run tests (windows)
        # tests involving MainWindow and VTKWindow do not work on Windows CI runners
        run: pytest -k "not test_main_window and not test_vtk_window"
        if: matrix.os == 'windows-latest'

      - name: Build executable
        run: pyinstaller Solidity-GUI.spec

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Solidity-GUI-open-${{ matrix.os }}
          path: dist/*
