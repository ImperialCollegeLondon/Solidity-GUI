name: Publish

on: [release]

env:
  TRIAL_EXPIRY_PERIOD: 60 # days

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-20.04, macos-latest]
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: pip install -r dev-requirements.txt

    - name: Setting trial expiry period to ${{env.TRIAL_EXPIRY_PERIOD}} days
      run: python set_trial_expiry.py ${{env.TRIAL_EXPIRY_PERIOD}}
      if: matrix.os == 'windows-latest'

    - name: Build executable
      run: pyinstaller Solidity-GUI.spec

    - uses: actions/upload-artifact@v3
      if: success()
      with:
        name: Solidity-GUI-${{matrix.os}}
        path: dist/*

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install system dependencies in Linux
      run: |
        sudo apt update

        # Without this, PySide6 gives an ImportError
        sudo apt install libegl1

    - name: Install dependencies
      run: pip install -r dev-requirements.txt

    - name: Deploy Docs
      run: mkdocs gh-deploy --force
