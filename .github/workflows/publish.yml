name: Publish

on: [release]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    uses: ./.github/workflows/build_executable.yml
    with:
      python-version: "3.11"

  docs:
    needs: test
    uses: ./.github/workflows/docs.yml
    with:
      python-version: "3.11"
