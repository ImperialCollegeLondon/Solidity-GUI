name: Test

on: [push]

env:
  TRIAL_EXPIRY_PERIOD: 60 # days

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pre-commit/action@v3.0.0

  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gaurav-nelson/github-action-markdown-link-check@1.0.15
        name: Check links in markdown files
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'

  test:
    needs: qa
    runs-on: ${{ matrix.os }}
    env:
      DISPLAY: ":99.0"
      QT_DEBUG_PLUGINS: 1 # adds some verbosity but helpful to debug QT issues
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, linux, macos, windows-trial]
        include:
          - platform: windows
            os: windows-latest
            python-version: [ "3.10", "3.11" ]
          - platform: linux
            os: ubuntu-20.04
            python-version: [ "3.10", "3.11" ]
          - platform: macos
            os: macos-latest
            python-version: [ "3.10", "3.11" ]
          - platform: windows-trial
            os: windows-latest
            python-version: "3.10"

    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies (Linux)
      run: |
        sudo apt update
        sudo apt-get install -y libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            x11-utils libegl1 libglu1-mesa libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxkbcommon-x11-0 libxcb-cursor0 libglu1-mesa
      if: matrix.os == 'ubuntu-20.04'

    - name: Setup XServer and Window Manager (Linux)
      run: |
        /sbin/start-stop-daemon --start --quiet --pidfile /tmp/custom_xvfb_99.pid \
          --make-pidfile --background --exec /usr/bin/Xvfb -- :99 -screen 0 \
          1920x1200x24 -ac +extension GLX +render -noreset
      if: matrix.os == 'ubuntu-20.04'

    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: pip install -r dev-requirements.txt

    - name: Run tests (not windows)
      run: pytest
      if: matrix.os != 'windows-latest'

    - name: Run tests (windows)
      # tests involving MainWindow and VTKWindow do not work on Windows CI runners
      run: pytest -k "not test_main_window and not test_vtk_window"
      if: matrix.os == 'windows-latest'

    - name: Setting trial expiry period to ${{env.TRIAL_EXPIRY_PERIOD}} days
      run: python set_trial_expiry.py ${{env.TRIAL_EXPIRY_PERIOD}}
      if: endsWith(matrix.platform, '-trial')

    - name: Build executable
      run: pyinstaller Solidity-GUI.spec
      # if: github.ref == 'refs/heads/main' && matrix.python-version == '3.10'
      if: matrix.python-version == '3.10'

    - uses: actions/upload-artifact@v3
      # if: github.ref == 'refs/heads/main' && matrix.python-version == '3.10' && success()
      if: matrix.python-version == '3.10' && success()
      with:
        name: Solidity-GUI-${{matrix.platform}}
        path: dist/*

    - name: Check for documentation errors with MkDocs
      run: |
        mkdocs build -s

  docs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install system dependencies in Linux
      run: |
        sudo apt update

        # Without this, PySide6 gives an ImportError
        sudo apt install libegl1

    - name: Install dependencies
      run: pip install -r dev-requirements.txt

    - name: Deploy Docs
      run: mkdocs gh-deploy --force
