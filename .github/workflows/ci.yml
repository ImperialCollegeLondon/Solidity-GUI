name: Test

on: [push]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pre-commit/action@v2.0.2

  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        name: Check links in markdown files
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'

  test:
    needs: qa
    runs-on: ${{ matrix.os }}
    env:
      DISPLAY: ":99.0"
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
        python-version: [ "3.10" ]

    steps:
    - uses: actions/checkout@v3

    - uses: tlambert03/setup-qt-libs@v1
    # - name: Install Dependencies (Linux)
    #   run: |
    #     sudo apt-get install -y libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
    #         libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
    #         x11-utils libegl1 libglu1-mesa libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
    #         libxcb-render-util0 libxkbcommon-x11-0
    #   if: matrix.os == 'ubuntu-latest'

    # - name: Setup XServer and Window Manager (Linux)
    #   run: |
    #     /sbin/start-stop-daemon --start --quiet --pidfile /tmp/custom_xvfb_99.pid \
    #       --make-pidfile --background --exec /usr/bin/Xvfb -- :99 -screen 0 \
    #       1920x1200x24 -ac +extension GLX +render -noreset
    #     sleep 2s
    #   if: matrix.os == 'ubuntu-latest'

    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: pip install -r dev-requirements.txt

    - name: Run tests
      run: pytest
