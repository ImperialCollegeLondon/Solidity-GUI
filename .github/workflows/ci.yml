name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pre-commit/action@v3.0.1

  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: gaurav-nelson/github-action-markdown-link-check@1.0.15
        name: Check links in markdown files
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'

  test:
    needs: qa
    runs-on: ${{ matrix.os }}
    env:
      DISPLAY: ":99.0"
      QT_DEBUG_PLUGINS: 1 # adds some verbosity but helpful to debug QT issues
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-20.04]
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies (Linux)
      run: |
        sudo apt update
        sudo apt-get install -y libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            x11-utils libegl1 libglu1-mesa libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxkbcommon-x11-0 libxcb-cursor0 libglu1-mesa
      if: matrix.os == 'ubuntu-20.04'

    - name: Setup XServer and Window Manager (Linux)
      run: |
        /sbin/start-stop-daemon --start --quiet --pidfile /tmp/custom_xvfb_99.pid \
          --make-pidfile --background --exec /usr/bin/Xvfb -- :99 -screen 0 \
          1920x1200x24 -ac +extension GLX +render -noreset
      if: matrix.os == 'ubuntu-20.04'

    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: "dev-requirements.txt"

    - name: Install dependencies
      run: pip install -r dev-requirements.txt

    - name: Run tests (not windows)
      run: pytest
      if: matrix.os != 'windows-latest'

    - name: Run tests (windows)
      # tests involving MainWindow and VTKWindow do not work on Windows CI runners
      run: pytest -k "not test_main_window and not test_vtk_window"
      if: matrix.os == 'windows-latest'

    - name: Check for documentation errors with MkDocs
      run: |
        mkdocs build -s
